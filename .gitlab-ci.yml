stages:
  - analysis
  - test
  - build
  - deploy

workflow:
  rules:
    - when: always

variables:
  GIT_DEPTH: 1

.tags_manylinux_2_28:
  tags: ["manylinux_2_28"]

.tags_win10:
  tags: ["eo", "win10", "arepytools-win"]

.tags_deploy:
  tags: ["eo", "deploy"]

# === analysis ===============================================================
# ============================================================================
formatting:
  stage: analysis
  extends:
    - .tags_manylinux_2_28
  needs: []
  script:
    - python3.12 -m pip install -e .[dev]
    - python3.12 -m ruff format --check
    - python3.12 -m ruff check --select I

ruff:
  stage: analysis
  extends:
    - .tags_manylinux_2_28
  needs: []
  script:
    - python3.12 -m pip install -e .[dev]
    - python3.12 -m ruff check

pyrefly:
  stage: analysis
  extends:
    - .tags_manylinux_2_28
  script:
    - python3.12 -m pip install -e .[typecheck]
    - python3.12 -m pyrefly check --python-interpreter-path $(python3.12 -c "import sys; print(sys.executable)")

# === test - unit test ========================================================
# ============================================================================
.unittest:
  stage: test
  script:
    - ${PYTHON_CMD} -m venv .venv
    - ${VENV_PYTHON} -m pip install -e .[test]
    - >-
      ${VENV_PYTHON} -m pytest
      --junitxml=_build/pytest-report-${PLATFORM}-py${PYTHON}.xml
      --cov-report=xml:_build/pytest-coverage-${PLATFORM}-py${PYTHON}.xml
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.12", "3.13", "3.14"]
  needs: []
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit:
        - _build/pytest-report-*.xml
      coverage_report:
        coverage_format: cobertura
        path: _build/pytest-coverage-*.xml

unittest_linux:
  extends:
    - .unittest
    - .tags_manylinux_2_28
  needs: []
  before_script:
    - mkdir -p _build
  variables:
    PLATFORM: linux
    PYTHON_CMD: python${PYTHON}
    VENV_PYTHON: .venv/bin/python

unittest_win:
  extends:
    - .unittest
    - .tags_win10
  needs: []
  before_script:
    - mkdir _build -Force
  variables:
    PLATFORM: win
    PYTHON_CMD: py -${PYTHON}
    VENV_PYTHON: .venv\Scripts\python.exe

# === build ==================================================================
# ============================================================================
build:
  stage: build
  extends:
    - .tags_manylinux_2_28
  needs: []
  script:
    - python3.12 -m pip install build
    - python3.12 -m build
  artifacts:
    expire_in: 2 weeks
    paths:
      - dist/*.tar.gz
      - dist/*.whl

build_docs:
  stage: build
  extends:
    - .tags_manylinux_2_28
  needs: []
  script:
    - python3.12 -m pip install .[docs]
    - python3.12 ./tools/build_doc.py
  artifacts:
    expire_in: 2 weeks
    paths:
      - site

# === deploy =================================================================
# ============================================================================
deploy_package:
  stage: deploy
  extends: .tags_deploy
  needs:
    - build
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - eval "$(ssh-agent -s)"
    - for file in dist/*.tar.gz dist/*.whl; do
      eo_pgp-signme ${file} > ${file}.asc &&
      ./.gitlab/ci/dashboard-copy.sh ${file} develop/aresys_io/archive &&
      ./.gitlab/ci/dashboard-copy.sh ${file}.asc develop/aresys_io/archive;
      done

deploy_doc:
  stage: deploy
  extends: .tags_deploy
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$DEPLOY_DOC == "true"'
  script:
    - eval "$(ssh-agent)"
    - cat "$DASHBOARD_PRIVATE_KEY" | base64 -d | ssh-add -
    - for file in docs/build/*.zip; do
      eo_pgp-signme ${file} > ${file}.asc &&
      ./.gitlab/ci/dashboard-copy.sh ${file} develop/aresys_io/archive &&
      ./.gitlab/ci/dashboard-copy.sh ${file}.asc develop/aresys_io/archive;
      done
    - unzip *.zip
    - mv site ${CI_COMMIT_TAG}
    - rsync --stats -r ${CI_COMMIT_TAG} sardashboard@intranet.aresys.it:develop/aresys_io/docs
    - ssh sardashboard@intranet.aresys.it "cd develop/aresys_io/docs && rm latest && ln -s ${CI_COMMIT_TAG} latest"
